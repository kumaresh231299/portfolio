<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0764"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="200" fill="url(#bg2)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="310" cy="20" r="70" fill="#6d28d9" opacity="0.2"/>
  <circle cx="20" cy="190" r="55" fill="#4c1d95" opacity="0.25"/>

  <!-- Album art card -->
  <rect x="30" y="30" width="100" height="140" rx="10" fill="url(#card2)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Album art placeholder -->
  <rect x="40" y="40" width="80" height="80" rx="8" fill="rgba(167,139,250,0.3)"/>
  <!-- Music note icon -->
  <text x="80" y="92" font-family="sans-serif" font-size="32" fill="rgba(255,255,255,0.7)" text-anchor="middle">♪</text>
  <!-- Song title -->
  <rect x="40" y="128" width="80" height="8" rx="4" fill="rgba(255,255,255,0.3)"/>
  <rect x="50" y="142" width="60" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <!-- Star rating -->
  <text x="60" y="162" font-family="sans-serif" font-size="10" fill="#fbbf24">★★★★</text>

  <!-- Player panel -->
  <rect x="142" y="30" width="188" height="140" rx="10" fill="url(#card2)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Now playing label -->
  <text x="236" y="50" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">NOW PLAYING</text>
  <text x="236" y="64" font-family="sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">Trending Track</text>
  <text x="236" y="76" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.55)" text-anchor="middle">Artist Name</text>

  <!-- Waveform bars -->
  <rect x="155" y="95" width="4" height="14" rx="2" fill="rgba(167,139,250,0.5)"/>
  <rect x="162" y="88" width="4" height="21" rx="2" fill="rgba(167,139,250,0.7)"/>
  <rect x="169" y="82" width="4" height="27" rx="2" fill="#a78bfa"/>
  <rect x="176" y="90" width="4" height="19" rx="2" fill="rgba(167,139,250,0.7)"/>
  <rect x="183" y="85" width="4" height="24" rx="2" fill="#c4b5fd"/>
  <rect x="190" y="92" width="4" height="17" rx="2" fill="rgba(167,139,250,0.7)"/>
  <rect x="197" y="87" width="4" height="22" rx="2" fill="#a78bfa"/>
  <rect x="204" y="93" width="4" height="16" rx="2" fill="rgba(167,139,250,0.5)"/>
  <rect x="211" y="89" width="4" height="20" rx="2" fill="rgba(167,139,250,0.7)"/>
  <rect x="218" y="84" width="4" height="25" rx="2" fill="#c4b5fd"/>
  <rect x="225" y="91" width="4" height="18" rx="2" fill="rgba(167,139,250,0.7)"/>
  <rect x="232" y="88" width="4" height="21" rx="2" fill="#a78bfa"/>
  <rect x="239" y="95" width="4" height="14" rx="2" fill="rgba(167,139,250,0.5)"/>
  <rect x="246" y="90" width="4" height="19" rx="2" fill="rgba(167,139,250,0.6)"/>
  <rect x="253" y="86" width="4" height="23" rx="2" fill="#c4b5fd"/>
  <rect x="260" y="93" width="4" height="16" rx="2" fill="rgba(167,139,250,0.5)"/>
  <rect x="267" y="89" width="4" height="20" rx="2" fill="rgba(167,139,250,0.6)"/>
  <rect x="274" y="84" width="4" height="25" rx="2" fill="#a78bfa"/>
  <rect x="281" y="91" width="4" height="18" rx="2" fill="rgba(167,139,250,0.5)"/>
  <rect x="288" y="95" width="4" height="14" rx="2" fill="rgba(167,139,250,0.4)"/>
  <rect x="295" y="88" width="4" height="21" rx="2" fill="rgba(167,139,250,0.5)"/>
  <rect x="302" y="92" width="4" height="17" rx="2" fill="rgba(167,139,250,0.4)"/>
  <rect x="309" y="87" width="4" height="22" rx="2" fill="#a78bfa"/>
  <rect x="316" y="93" width="4" height="16" rx="2" fill="rgba(167,139,250,0.4)"/>

  <!-- Progress bar -->
  <rect x="155" y="122" width="170" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="155" y="122" width="80" height="4" rx="2" fill="#a78bfa"/>
  <circle cx="235" cy="124" r="5" fill="white"/>
  <text x="155" y="136" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.4)">1:23</text>
  <text x="325" y="136" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="end">3:45</text>

  <!-- Controls -->
  <text x="185" y="158" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" text-anchor="middle">⏮</text>
  <circle cx="236" cy="151" r="13" fill="#a78bfa"/>
  <text x="236" y="157" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">▶</text>
  <text x="287" y="158" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" text-anchor="middle">⏭</text>

  <!-- Playlist items -->
  <rect x="155" y="168" width="170" height="1" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="155" y="172" width="100" height="5" rx="2" fill="rgba(255,255,255,0.15)"/>
  <rect x="155" y="180" width="75" height="5" rx="2" fill="rgba(255,255,255,0.1)"/>

  <!-- Title -->
  <text x="180" y="20" font-family="sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">MUSIC STREAMING APP</text>
</svg>
