<svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="200" fill="url(#bg1)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="320" cy="30" r="60" fill="#3b82f6" opacity="0.18"/>
  <circle cx="30" cy="180" r="50" fill="#1d4ed8" opacity="0.2"/>

  <!-- Main card -->
  <rect x="90" y="28" width="180" height="144" rx="10" fill="url(#card1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Lock icon circle -->
  <circle cx="180" cy="72" r="22" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Lock body -->
  <rect x="168" y="72" width="24" height="18" rx="3" fill="white" opacity="0.9"/>
  <!-- Lock shackle -->
  <path d="M171 72 v-7 a9 9 0 0 1 18 0 v7" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Keyhole -->
  <circle cx="180" cy="80" r="2.5" fill="#2563eb"/>
  <rect x="178.5" y="80" width="3" height="5" rx="1" fill="#2563eb"/>

  <!-- Email field -->
  <rect x="108" y="102" width="144" height="18" rx="5" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="120" y="114" font-family="sans-serif" font-size="8" fill="rgba(255,255,255,0.5)">Enter your email</text>
  <rect x="238" y="106" width="6" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>

  <!-- Reset button -->
  <rect x="108" y="128" width="144" height="22" rx="6" fill="#60a5fa"/>
  <text x="180" y="143" font-family="sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">Reset Password</text>

  <!-- JWT badge -->
  <rect x="108" y="156" width="40" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="128" y="165" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.8)" text-anchor="middle">JWT</text>
  <rect x="153" y="156" width="55" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="180" y="165" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.8)" text-anchor="middle">Nodemailer</text>
  <rect x="213" y="156" width="39" height="12" rx="6" fill="rgba(255,255,255,0.15)"/>
  <text x="232" y="165" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.8)" text-anchor="middle">MongoDB</text>

  <!-- Title -->
  <text x="180" y="20" font-family="sans-serif" font-size="9" font-weight="700" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">PASSWORD RESET APP</text>
</svg>
